[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests import the app as `src.*`; add the repo root to sys.path so this
# works from a bare checkout (CI) as well as an editable local install.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI's Depends()/File() defaults are the framework's documented idiom.
"src/api/routes/*" = ["B008"]
