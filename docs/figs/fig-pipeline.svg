<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Review pipeline: authenticated browser session, coordinator decision loop, three specialists dispatched concurrently, and two-gate verification that either records a patch or rolls it back."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7B8794"/></marker></defs><rect width="1000" height="430" fill="#FFFFFF"/><text x="0" y="14" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">BROWSER</text><rect x="0" y="26" width="1000" height="54" fill="#F0F3F5" rx="3" stroke="#BCC5CE" stroke-width="1.2"/><text x="20" y="51" font-size="14" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Authenticated session</text><text x="20" y="69" font-size="12" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">Firebase email link  ·  signed cookie  ·  gated on every route</text><text x="980" y="58" font-size="12" fill="#7B8794" font-family="Menlo, monospace" font-weight="400" text-anchor="end">Server-Sent Events</text><path d="M 962 80 L 962 300" fill="none" stroke="#7B8794" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="3 4"/><text x="952" y="195" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="end">live events</text><text x="0" y="108" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">COORDINATOR</text><rect x="0" y="120" width="830" height="62" fill="#FFFFFF" rx="3" stroke="#1F2933" stroke-width="1.6"/><text x="20" y="145" font-size="14" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Bounded decision loop</text><text x="20" y="164" font-size="12" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">plans  ·  dispatches  ·  judges findings  ·  retries failures  ·  finishes</text><text x="812" y="155" font-size="11" fill="#7B8794" font-family="Menlo, monospace" font-weight="400" text-anchor="end">14 iterations max</text><path d="M 150 182 L 150 210" fill="none" stroke="#7B8794" stroke-width="1.2" marker-end="url(#ar)"/><path d="M 415 182 L 415 210" fill="none" stroke="#7B8794" stroke-width="1.2" marker-end="url(#ar)"/><path d="M 680 182 L 680 210" fill="none" stroke="#7B8794" stroke-width="1.2" marker-end="url(#ar)"/><text x="437" y="226" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start" font-style="italic">dispatched in one turn — run concurrently</text><text x="0" y="232" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">SPECIALISTS</text><rect x="0" y="244" width="264" height="56" fill="#FFFFFF" rx="3" stroke="#BCC5CE" stroke-width="1.2"/><text x="16" y="267" font-size="13.5" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Security</text><text x="16" y="286" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">injection · secrets · authn</text><rect x="283" y="244" width="264" height="56" fill="#FFFFFF" rx="3" stroke="#BCC5CE" stroke-width="1.2"/><text x="299" y="267" font-size="13.5" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Bug Detection</text><text x="299" y="286" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">nulls · leaks · races</text><rect x="566" y="244" width="264" height="56" fill="#FFFFFF" rx="3" stroke="#BCC5CE" stroke-width="1.2"/><text x="582" y="267" font-size="13.5" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Fix</text><text x="582" y="286" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">writes and applies patches</text><path d="M 698 300 L 698 330" fill="none" stroke="#7B8794" stroke-width="1.2" marker-end="url(#ar)"/><text x="0" y="330" font-size="11" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">VERIFICATION</text><rect x="566" y="342" width="264" height="62" fill="#F0F3F5" rx="3" stroke="#1F2933" stroke-width="1.6"/><text x="582" y="366" font-size="13.5" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Two gates</text><text x="582" y="385" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">compile  +  AST pattern removal</text><path d="M 830 373 L 892 373" fill="none" stroke="#2F6B4F" stroke-width="1.4" marker-end="url(#ar)"/><text x="898" y="369" font-size="12" fill="#2F6B4F" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">recorded</text><path d="M 566 373 L 470 373" fill="none" stroke="#9B3B36" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M 470 373 L 470 216" fill="none" stroke="#9B3B36" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M 470 216 L 470 182" fill="none" stroke="#9B3B36" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="462" y="340" font-size="11.5" fill="#9B3B36" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="end" font-style="italic">rejected — rolled back,</text><text x="462" y="356" font-size="11.5" fill="#9B3B36" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="end" font-style="italic">reason returned to the coordinator</text></svg>