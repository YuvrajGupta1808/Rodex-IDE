<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The two verification gates: compile, then AST pattern removal. Failure at either gate rolls the patch back and returns the reason to the coordinator."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7B8794"/></marker></defs><rect width="1000" height="250" fill="#FFFFFF"/><rect x="0" y="30" width="196" height="66" fill="#FFFFFF" rx="3" stroke="#BCC5CE" stroke-width="1.2"/><text x="98" y="58" font-size="13.5" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="middle">Patch proposed</text><text x="98" y="78" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="middle">by the fix agent</text><path d="M 196 63 L 250 63" fill="none" stroke="#7B8794" stroke-width="1.3" marker-end="url(#ar)"/><rect x="250" y="20" width="230" height="86" fill="#FFFFFF" rx="3" stroke="#1F2933" stroke-width="1.6"/><text x="266" y="42" font-size="10.5" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">GATE 1</text><text x="266" y="63" font-size="14" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Compile</text><text x="266" y="82" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">written to sandbox,</text><text x="266" y="97" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">compiled</text><path d="M 480 63 L 534 63" fill="none" stroke="#7B8794" stroke-width="1.3" marker-end="url(#ar)"/><rect x="534" y="20" width="230" height="86" fill="#FFFFFF" rx="3" stroke="#1F2933" stroke-width="1.6"/><text x="550" y="42" font-size="10.5" fill="#7B8794" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start" letter-spacing="1.6">GATE 2</text><text x="550" y="63" font-size="14" fill="#1F2933" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="start">Pattern removal</text><text x="550" y="82" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">AST walked before and after;</text><text x="550" y="97" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start">occurrences counted</text><path d="M 764 63 L 818 63" fill="none" stroke="#2F6B4F" stroke-width="1.4" marker-end="url(#ar)"/><rect x="818" y="30" width="182" height="66" fill="#F0F3F5" rx="3" stroke="#2F6B4F" stroke-width="1.6"/><text x="909" y="58" font-size="13.5" fill="#2F6B4F" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="middle">Recorded</text><text x="909" y="78" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="middle">written to the file</text><path d="M 365 106 L 365 176" fill="none" stroke="#9B3B36" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="378" y="140" font-size="11.5" fill="#9B3B36" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start" font-style="italic">does not parse</text><path d="M 649 106 L 649 176" fill="none" stroke="#9B3B36" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="662" y="140" font-size="11.5" fill="#9B3B36" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="start" font-style="italic">count not reduced</text><rect x="250" y="176" width="514" height="58" fill="#FFFFFF" rx="3" stroke="#9B3B36" stroke-width="1.6"/><text x="507" y="200" font-size="13.5" fill="#9B3B36" font-family="Charter, Georgia, serif" font-weight="700" text-anchor="middle">Rolled back</text><text x="507" y="220" font-size="11.5" fill="#3E4C59" font-family="Charter, Georgia, serif" font-weight="400" text-anchor="middle">failure reason returned to the coordinator, which decides whether to retry</text></svg>